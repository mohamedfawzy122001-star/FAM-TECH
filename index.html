 const dp={'شركة النور للمقاولات':['0100 111 2201','مقاولات عامة وتشطيبات'],'مؤسسة الفتح للأمن والحماية':['0111 222 3302','أنظمة مراقبة وأمن'],'ورشة الأمل':['0122 333 4403','ورشة صيانة وتركيبات'],'أ/ محمود السيد':['0100 444 5504','مهندس تركيبات كهرباء'],'مصنع الأمل للمسامير':['0155 666 7705','تصنيع مسامير وصواميل'],'شركة الشرق للأدوات':['0106 777 8806','استيراد عدد وآلات'],'النيل للإلكترونيات':['0128 888 9907','كاميرات وإلكترونيات']};
 [...db.invoices.map(i=>['c',i.cust]),...db.purchases.map(i=>['s',i.supplier])].forEach(([t,n])=>{if(n&&n!='عميل نقدي'&&!db.parties.some(p=>p.type==t&&p.name==n)){const d=dp[n]||[];db.parties.push({id:uid(),type:t,name:n,phone:d[0]||'',spec:d[1]||''})}});db.parties=db.parties.filter(p=>p.name!='عميل نقدي');db.parties.forEach(p=>{if(p.terms==null)p.terms=['شركة النور للمقاولات','مؤسسة الفتح للأمن والحماية','مصنع الأمل للمسامير','شركة الشرق للأدوات'].includes(p.name)?'آجل':'كاش'});db.parties.forEach(p=>{if(p.limit==null)p.limit=({'شركة النور للمقاولات':50000,'مؤسسة الفتح للأمن والحماية':30000,'مصنع الأمل للمسامير':40000,'شركة الشرق للأدوات':60000})[p.name]||0});if(!db.credDemo){db.credDemo=1;const ad=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)},pz=(i,t,n)=>{if(i){i.pm=t;i.due=ad(i.date,n);i.paid=false}};pz(db.invoices.find(i=>i.cust=='مؤسسة الفتح للأمن والحماية'&&!i.pm),'آجل 30 يوم',30);pz(db.invoices.find(i=>i.cust=='شركة النور للمقاولات'&&!i.pm),'آجل 15 يوم',3);pz(db.purchases.find(i=>i.supplier=='مصنع الأمل للمسامير'&&!i.pm),'آجل 30 يوم',30)}db.items.forEach(i=>{if(!i.wh)i.wh=db.whs[0];if(!i.barcode)i.barcode=nb()})}

const nb=()=>{let b;do{b='20'+String(++db.seq).padStart(8,'0')}while(db.items.some(i=>i.barcode==b));return b};
const C39={0:'nnnwwnwnn',1:'wnnwnnnnw',2:'nnwwnnnnw',3:'wnwwnnnnn',4:'nnnwwnnnw',5:'wnnwwnnnn',6:'nnwwwnnnn',7:'nnnwnnwnw',8:'wnnwnnwnn',9:'nnwwnnwnn','*':'nwnnwnwnn'};
